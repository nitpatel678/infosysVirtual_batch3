<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sentry-shield-grad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="sentry-core-grad" x1="18" y1="16" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="sentry-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Shield Armor -->
  <path d="M32 4L10 14V31C10 44.8 19.4 56.6 32 60C44.6 56.6 54 44.8 54 31V14L32 4Z" fill="#0b0f19" stroke="url(#sentry-shield-grad)" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Inner Circuit / Shield Crest -->
  <path d="M32 11L16 18.5V30.5C16 40.5 22.8 49.3 32 52.5C41.2 49.3 48 40.5 48 30.5V18.5L32 11Z" fill="url(#sentry-core-grad)" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 2"/>
  <!-- Center Sentry Eye / Iris -->
  <circle cx="32" cy="31" r="10" stroke="url(#sentry-shield-grad)" stroke-width="2.5" filter="url(#sentry-glow)"/>
  <circle cx="32" cy="31" r="5" fill="#38bdf8"/>
  <circle cx="34" cy="29" r="1.5" fill="#ffffff"/>
  <!-- Scan lines / Crosshair accents -->
  <path d="M32 16V20M32 42V46M17 31H21M43 31H47" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
</svg>